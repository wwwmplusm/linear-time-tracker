[project]
name = "linear-time-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.22",
    "tzdata>=2025.2",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx2",
    "playwright>=1.52",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "main:app"
